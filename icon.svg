<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="0.45" stop-color="#4a2fb0"/>
      <stop offset="1" stop-color="#140c3a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3a8" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffd24a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#b8ffc6"/>
      <stop offset=".35" stop-color="#5ef07a"/>
      <stop offset=".8" stop-color="#1fa84a"/>
      <stop offset="1" stop-color="#0f7a33"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fbffe0"/>
      <stop offset="1" stop-color="#c8f5a0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#fff1d0"/>
      <stop offset="1" stop-color="#e2b86a"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset=".5" stop-color="#ffc633"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#3a2a8a"/>
      <stop offset="1" stop-color="#0d0930"/>
    </radialGradient>
    <radialGradient id="fire" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#ff8a2a"/><stop offset="1" stop-color="#e0301e"/></radialGradient>
    <radialGradient id="water" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#e0fbff"/><stop offset=".5" stop-color="#4cc3ff"/><stop offset="1" stop-color="#1d5fd6"/></radialGradient>
    <radialGradient id="bolt" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#fffbe0"/><stop offset=".5" stop-color="#ffe14a"/><stop offset="1" stop-color="#e0a000"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0b0628" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="card"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- 빛줄기 -->
    <g transform="translate(256 250)" fill="#fff" opacity=".09">
      <path d="M0 0 L-40 -420 L40 -420 Z"/>
      <path d="M0 0 L-40 -420 L40 -420 Z" transform="rotate(30)"/>
      <path d="M0 0 L-40 -420 L40 -420 Z" transform="rotate(60)"/>
      <path d="M0 0 L-40 -420 L40 -420 Z" transform="rotate(90)"/>
      <path d="M0 0 L-40 -420 L40 -420 Z" transform="rotate(120)"/>
      <path d="M0 0 L-40 -420 L40 -420 Z" transform="rotate(150)"/>
      <path d="M0 0 L-40 -420 L40 -420 Z" transform="rotate(180)"/>
      <path d="M0 0 L-40 -420 L40 -420 Z" transform="rotate(210)"/>
      <path d="M0 0 L-40 -420 L40 -420 Z" transform="rotate(240)"/>
      <path d="M0 0 L-40 -420 L40 -420 Z" transform="rotate(270)"/>
      <path d="M0 0 L-40 -420 L40 -420 Z" transform="rotate(300)"/>
      <path d="M0 0 L-40 -420 L40 -420 Z" transform="rotate(330)"/>
    </g>
    <circle cx="256" cy="250" r="230" fill="url(#glow)"/>
    <!-- 바닥 그림자 -->
    <ellipse cx="256" cy="476" rx="150" ry="20" fill="#0b0628" opacity=".45" filter="url(#soft)"/>
  </g>

  <!-- 속성 구슬 (불·물·번개가 합쳐지는 느낌) -->
  <g filter="url(#sh)">
    <circle cx="88" cy="150" r="30" fill="url(#fire)"/>
    <path d="M88 132 C96 142 102 150 96 162 C92 170 80 170 78 160 C76 152 84 148 82 140 C86 144 88 138 88 132 Z" fill="#fff6c0" opacity=".9"/>
    <circle cx="426" cy="140" r="28" fill="url(#water)"/>
    <path d="M426 124 C434 136 438 144 434 152 C430 160 420 160 417 152 C414 144 420 136 426 124 Z" fill="#ffffff" opacity=".85"/>
    <circle cx="438" cy="352" r="24" fill="url(#bolt)"/>
    <path d="M442 336 L428 356 L438 356 L432 370 L448 348 L438 348 Z" fill="#fff" opacity=".95"/>
  </g>
  <g fill="#fff">
    <path d="M150 74 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" opacity=".95"/>
    <path d="M372 60 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" opacity=".85"/>
    <path d="M72 330 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" opacity=".75"/>
    <circle cx="120" cy="250" r="4" opacity=".7"/>
    <circle cx="400" cy="250" r="3.5" opacity=".7"/>
  </g>

  <g filter="url(#sh)">
    <!-- 뿔 -->
    <path d="M186 146 Q160 84 196 58 Q204 108 230 134 Z" fill="url(#horn)" stroke="#a3480c" stroke-width="7" stroke-linejoin="round"/>
    <path d="M326 146 Q352 84 316 58 Q308 108 282 134 Z" fill="url(#horn)" stroke="#a3480c" stroke-width="7" stroke-linejoin="round"/>
    <!-- 팔 -->
    <path d="M140 268 Q96 236 104 200 Q128 214 150 242 Z" fill="#3fd062" stroke="#0c5a26" stroke-width="7" stroke-linejoin="round"/>
    <path d="M372 268 Q416 236 408 200 Q384 214 362 242 Z" fill="#3fd062" stroke="#0c5a26" stroke-width="7" stroke-linejoin="round"/>
    <!-- 몸 -->
    <ellipse cx="256" cy="252" rx="132" ry="122" fill="url(#body)" stroke="#0c5a26" stroke-width="8"/>
    <ellipse cx="256" cy="300" rx="80" ry="58" fill="url(#belly)" opacity=".9"/>
    <!-- 광택 -->
    <ellipse cx="206" cy="176" rx="50" ry="24" fill="#fff" opacity=".45" transform="rotate(-22 206 176)"/>
    <circle cx="170" cy="210" r="8" fill="#fff" opacity=".5"/>
    <!-- 점무늬 -->
    <circle cx="340" cy="196" r="10" fill="#1d9a44" opacity=".6"/>
    <circle cx="360" cy="226" r="6" fill="#1d9a44" opacity=".6"/>
    <circle cx="160" cy="276" r="7" fill="#1d9a44" opacity=".5"/>
    <!-- 눈 -->
    <ellipse cx="210" cy="236" rx="33" ry="39" fill="#fff" stroke="#0c5a26" stroke-width="7"/>
    <ellipse cx="302" cy="236" rx="33" ry="39" fill="#fff" stroke="#0c5a26" stroke-width="7"/>
    <circle cx="218" cy="246" r="20" fill="url(#eye)"/>
    <circle cx="294" cy="246" r="20" fill="url(#eye)"/>
    <circle cx="226" cy="236" r="8" fill="#fff"/>
    <circle cx="302" cy="236" r="8" fill="#fff"/>
    <circle cx="212" cy="256" r="3.5" fill="#fff" opacity=".8"/>
    <circle cx="288" cy="256" r="3.5" fill="#fff" opacity=".8"/>
    <!-- 볼 -->
    <ellipse cx="170" cy="288" rx="20" ry="12" fill="#ff6fa3" opacity=".75"/>
    <ellipse cx="342" cy="288" rx="20" ry="12" fill="#ff6fa3" opacity=".75"/>
    <!-- 입 -->
    <path d="M222 290 Q256 330 290 290 Z" fill="#7a1433" stroke="#0c5a26" stroke-width="7" stroke-linejoin="round"/>
    <path d="M240 312 Q256 324 272 312 Q256 304 240 312 Z" fill="#ff7a9a"/>
    <path d="M236 293 l7 13 7 -12 z" fill="#fff"/>
    <path d="M276 293 l-7 13 -7 -12 z" fill="#fff"/>
  </g>

  <!-- 알 껍데기 (아래) -->
  <g filter="url(#sh)" transform="translate(256 0) scale(.96 .92) translate(-256 58)">
    <path d="M104 322 L140 290 L176 326 L214 286 L256 326 L298 286 L336 326 L372 290 L408 322
             Q414 452 256 464 Q98 452 104 322 Z"
          fill="url(#shell)" stroke="#a87a2c" stroke-width="8" stroke-linejoin="round"/>
    <path d="M130 360 Q140 420 196 444" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".7"/>
    <circle cx="190" cy="388" r="16" fill="#7b5cff"/>
    <circle cx="186" cy="383" r="5" fill="#fff" opacity=".6"/>
    <circle cx="268" cy="414" r="12" fill="#ff5ce1"/>
    <circle cx="265" cy="410" r="4" fill="#fff" opacity=".6"/>
    <circle cx="336" cy="374" r="15" fill="#3da5ff"/>
    <circle cx="332" cy="369" r="5" fill="#fff" opacity=".6"/>
    <circle cx="232" cy="358" r="8" fill="#ffb020"/>
    <circle cx="300" cy="432" r="7" fill="#4cd964"/>
  </g>
</svg>
