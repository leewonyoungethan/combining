<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>몬스터 합치기</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1024">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="몬스터 합치기">
<link rel="stylesheet" href="style.css?v=132">
<script>
  // 게임이 켜지다가 문제가 생기면 멈춘 화면 대신 다시 시도 버튼을 보여 준다
  window.addEventListener('error', function (e) { window.__bootErr = (e && e.message) || '알 수 없는 오류'; });
  function __hardReload() {
    var go = function () { location.replace(location.pathname + '?r=' + Date.now()); };
    try {
      var jobs = [];
      if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
      if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
      Promise.all(jobs).then(go, go);
    } catch (e) { go(); }
  }
  setTimeout(function () {
    if (window.__booted) return;
    var o = document.getElementById('opening'); if (o) o.remove();
    var l = document.getElementById('loader'); if (!l) return;
    l.innerHTML = '<div class="ld-fail"><div class="ld-fail-ico">😵</div><h2>게임을 불러오지 못했어요</h2>' +
      '<p>인터넷 연결을 확인하고 다시 시도해 주세요.</p>' +
      '<button onclick="location.reload()">🔄 다시 시도</button><button onclick="__hardReload()">🧹 새로 받기</button>' +
      '<small>' + (window.__bootErr ? String(window.__bootErr).replace(/[<>&]/g, '') : '') + '</small></div>';
  }, 12000);
</script>
</head>
<body>
<div id="opening" class="opening">
  <video id="openingVideo" src="opening.mp4?v=2" playsinline webkit-playsinline preload="auto"></video>
  <button id="openingTap" class="opening-tap hidden">🔊 소리 켜기</button>
  <button id="openingSkip" class="opening-skip" onclick="if(!window.__booted){var o=document.getElementById('opening');if(o)o.remove();}">건너뛰기 ⏭</button>
</div>
<div id="loader" class="loader">
  <div class="ld-rays"></div>
  <div class="ld-stars"></div>
  <div class="ld-center">
    <div class="ld-logo"><div class="ld-ring"><div class="ld-orbit"><span style="--a:0deg"><i>🐉</i></span><span style="--a:45deg"><i>🦊</i></span><span style="--a:90deg"><i>🐙</i></span><span style="--a:135deg"><i>🦄</i></span><span style="--a:180deg"><i>🐢</i></span><span style="--a:225deg"><i>🦅</i></span><span style="--a:270deg"><i>🐺</i></span><span style="--a:315deg"><i>🦖</i></span></div></div><img src="icon.svg" alt=""></div>
    <h1 class="ld-title">몬스터 합치기</h1>
    <div class="ld-sub">MONSTER MERGE</div>
  </div>
  <div class="ld-bottom">
    <div class="ld-status" id="ldStatus">섬을 불러오는 중…</div>
    <div class="ld-bar"><i id="ldFill"></i><b id="ldPct">0%</b></div>
    <div class="ld-tip" id="ldTip"></div>
    <div class="ld-credit">LEE WONYOUNG STUDIOS</div>
  </div>
</div>
<canvas id="world"></canvas>

<header class="hud">
  <div class="logo"><img src="icon.svg" alt=""> 몬스터 합치기</div>
  <div class="res">
    <button class="pill res-pill" data-act="resInfo" data-r="gold"><span>💰</span><b id="gold">0</b></button>
    <button class="pill res-pill" data-act="resInfo" data-r="gems"><span>💎</span><b id="gems">0</b></button>
    <button class="pill res-pill" data-act="resInfo" data-r="food"><span>🍖</span><b id="food">0</b></button>
    <button class="pill code-btn daily-btn" data-act="daily" title="일일 보상">🎁<i class="dot" id="dailyDot"></i></button>
    <button class="pill code-btn mis-btn" data-act="missions" title="미션">📋<i class="dot" id="misDot"></i></button>
    <button class="pill code-btn" data-act="account" title="계정">👤</button>
    <button class="pill code-btn full-btn hidden" id="fullBtn" data-act="fullscreen" title="전체화면">⛶</button>
    <button class="pill code-btn tut-btn" data-act="help" title="튜토리얼">🎓<span>튜토리얼</span></button>
    <button class="pill code-btn menu-btn" id="menuBtn" data-act="menu" title="메뉴">☰<i class="dot" id="menuDot"></i></button>
  </div>
</header>

<section id="panel" class="panel hidden">
  <button class="panel-x" data-act="tab" data-tab="island">✕</button>
  <main id="view"></main>
</section>

<div id="islandBar" class="island-bar"></div>
<div id="visitBar" class="visit-bar hidden"></div>
<button id="hideBtn" class="hide-btn" data-act="hideUI">🙈 숨기기</button>
<button id="petBtn" class="pet-btn hidden" data-act="pets">🐾<small>펫</small></button>
<button id="evtBtn" class="pet-btn evt-btn hidden" data-act="event">🎉<small>이벤트</small></button>
<button id="fishBtn" class="pet-btn fish-btn hidden" data-act="fishing">🎣<small>낚시</small></button>
<button id="questBtn" class="pet-btn quest-btn hidden" data-act="quests">📜<small>퀘스트</small><i class="dot"></i></button>
<div id="zoomBtns" class="zoom-btns"><button data-act="zoomIn" title="확대">＋</button><button data-act="zoomOut" title="축소">−</button></div>
<div id="guide" class="guide hidden"></div>
<button id="goalChip" class="goal-chip hidden" data-act="goalGo"></button>

<nav class="bottom-bar">
  <button class="round" data-act="tab" data-tab="island">🏝️<span>섬</span></button>
  <button class="round" data-act="tab" data-tab="adventure">⚔️<span>모험</span></button>
  <button class="round" data-act="tab" data-tab="mons">🐾<span>몬스터</span></button>
  <button class="round" data-act="tab" data-tab="shop">🛒<span>상점</span></button>
  <button class="round" data-act="tab" data-tab="dex">📖<span>도감</span></button>
  <button class="round gold" data-act="collectAll">💰<span>모두 걷기</span></button>
</nav>

<div id="battle" class="battle hidden"></div>
<div id="login" class="login hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast"></div>
<div id="finger" class="finger hidden"><span class="f-hand">👆</span><span class="f-tip">여기를 눌러요!</span></div>

<script src="game.js?v=133"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
</body>
</html>
